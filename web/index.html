<!DOCTYPE html>
<html lang="es-CO">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="GoldVault — Claridad sobre tu dinero: registro automático de bancos, metas y análisis en tiempo real.">
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GoldVault">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>GoldVault — Finanzas Personales</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0e0f12;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    @media (prefers-color-scheme: light) {
      html, body { background-color: #f6f2ea; }
    }
  </style>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let r of registrations) { r.unregister(); }
      });
    }

    (function() {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      var params = new URLSearchParams(search);
      var hashParams = new URLSearchParams(hash.replace(/^#/, ''));

      var isApkBridge = params.get('apk_redirect') === '1' ||
                        hashParams.get('apk_redirect') === '1' ||
                        window.location.pathname.indexOf('/apk-callback') === 0;

      var hasAuthPayload = params.has('code') ||
                           params.has('error') ||
                           hashParams.has('access_token') ||
                           hashParams.has('error');

      if (isApkBridge) {
        var isAndroid = /android/i.test(navigator.userAgent || '');
        var deepLink = 'goldvault://login-callback' + search + hash;
        var intentPath = 'login-callback' + search + hash;
        var intentUrl = 'intent://' + intentPath + '#Intent;scheme=goldvault;package=app.goldvault.goldvault;end';

        document.head.insertAdjacentHTML('beforeend',
          '<style>' +
          '.gv-bridge-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0e0f12;color:#ece7dd;}' +
          '.gv-bridge-card{width:100%;max-width:360px;background:#14161b;border:1px solid rgba(236,231,221,0.12);border-radius:18px;padding:28px 22px;text-align:center;box-sizing:border-box;}' +
          '.gv-bridge-logo{font-size:24px;font-weight:800;letter-spacing:-0.4px;margin-bottom:12px;}' +
          '.gv-bridge-logo span{color:#d9b87a;}' +
          '.gv-bridge-desc{font-size:13px;line-height:1.5;color:#8b867c;margin:0 0 22px 0;}' +
          '.gv-bridge-btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;background:#d9b87a;color:#17130b;font-weight:800;font-size:15px;border-radius:11px;text-decoration:none;border:none;cursor:pointer;box-sizing:border-box;margin-bottom:12px;}' +
          '.gv-bridge-btn-sec{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;background:transparent;color:#ece7dd;font-weight:600;font-size:13px;border-radius:11px;text-decoration:none;border:1px solid rgba(236,231,221,0.14);box-sizing:border-box;}' +
          '</style>'
        );

        document.body.innerHTML =
          '<div class="gv-bridge-wrap">' +
            '<div class="gv-bridge-card">' +
              '<div class="gv-bridge-logo">Gold<span>Vault</span></div>' +
              '<p class="gv-bridge-desc">' +
                (hasAuthPayload
                  ? 'Autenticacion completada. Redirigiendo de vuelta a la aplicacion GoldVault en tu telefono...'
                  : 'Conectando con la aplicacion GoldVault...') +
              '</p>' +
              '<a id="gv-open-apk" class="gv-bridge-btn" href="' + deepLink + '">Abrir en la app GoldVault</a>' +
              (isAndroid ? '<a id="gv-open-intent" class="gv-bridge-btn-sec" href="' + intentUrl + '">Reintentar apertura directa</a>' : '') +
            '</div>' +
          '</div>';

        // Trigger immediate deep link redirect back to the native app (Android & iOS)
        try {
          window.location.replace(deepLink);
        } catch (_) {}

        if (isAndroid) {
          setTimeout(function() {
            try {
              window.location.href = intentUrl;
            } catch (_) {}
          }, 650);
        }

        return;
      }

      var s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
