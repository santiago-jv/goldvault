<!DOCTYPE html>
<html lang="es-CO">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="GoldVault — Claridad sobre tu dinero: registro automático de bancos, metas y análisis en tiempo real.">
  <meta name="theme-color" content="#0b0b0e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GoldVault">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>GoldVault — Finanzas Personales</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light dark;
      --gv-bg-light: #f7f8fa;
      --gv-bg-dark: #0b0b0e;
      --gv-card-light: #ffffff;
      --gv-card-dark: #151519;
      --gv-txt-light: #111113;
      --gv-txt-dark: #f5f5f7;
      --gv-mut-light: #525866;
      --gv-mut-dark: #a8a8b3;
      --gv-line-light: rgba(0, 0, 0, 0.12);
      --gv-line-dark: rgba(255, 255, 255, 0.16);
      --gv-bg: var(--gv-bg-light);
      --gv-card: var(--gv-card-light);
      --gv-txt: var(--gv-txt-light);
      --gv-mut: var(--gv-mut-light);
      --gv-line: var(--gv-line-light);
      --gv-cta-bg: #111113;
      --gv-cta-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --gv-bg: var(--gv-bg-dark);
        --gv-card: var(--gv-card-dark);
        --gv-txt: var(--gv-txt-dark);
        --gv-mut: var(--gv-mut-dark);
        --gv-line: var(--gv-line-dark);
        --gv-cta-bg: #f5f5f7;
        --gv-cta-fg: #0b0b0e;
      }
    }
    @supports (color: light-dark(white, black)) {
      :root {
        --gv-bg: light-dark(var(--gv-bg-light), var(--gv-bg-dark));
        --gv-card: light-dark(var(--gv-card-light), var(--gv-card-dark));
        --gv-txt: light-dark(var(--gv-txt-light), var(--gv-txt-dark));
        --gv-mut: light-dark(var(--gv-mut-light), var(--gv-mut-dark));
        --gv-line: light-dark(var(--gv-line-light), var(--gv-line-dark));
        --gv-cta-bg: light-dark(#111113, #f5f5f7);
        --gv-cta-fg: light-dark(#ffffff, #0b0b0e);
      }
    }
    @media (forced-colors: active) {
      :root {
        --gv-bg: Canvas;
        --gv-card: Canvas;
        --gv-txt: CanvasText;
        --gv-mut: GrayText;
        --gv-line: CanvasText;
        --gv-cta-bg: ButtonFace;
        --gv-cta-fg: ButtonText;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--gv-bg);
      color: var(--gv-txt);
      height: 100%;
      width: 100%;
      overflow: hidden;
      line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif;
    }
    .gv-bridge-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      box-sizing: border-box;
      background: var(--gv-bg);
      color: var(--gv-txt);
    }
    .gv-bridge-card {
      width: 100%;
      max-width: 22.5rem;
      background: var(--gv-card);
      border: 1px solid var(--gv-line);
      border-radius: 1.125rem;
      padding: 2rem 1.5rem;
      text-align: center;
      box-sizing: border-box;
      overflow-wrap: break-word;
    }
    .gv-bridge-logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 0.75rem;
      color: var(--gv-txt);
      text-wrap: balance;
    }
    .gv-bridge-logo span {
      color: var(--gv-mut);
      font-weight: 500;
    }
    .gv-bridge-desc {
      font-size: 0.875rem;
      line-height: 1.5;
      color: var(--gv-mut);
      margin: 0 0 1.375rem 0;
      text-wrap: pretty;
    }
    .gv-bridge-btn,
    .gv-bridge-btn-sec {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-block-size: 2.875rem;
      padding: 0.625rem 1rem;
      border-radius: 999px;
      text-decoration: none;
      box-sizing: border-box;
      font-weight: 600;
      line-height: 1.3;
    }
    @media (prefers-reduced-motion: no-preference) {
      .gv-bridge-btn,
      .gv-bridge-btn-sec {
        transition: opacity 150ms ease-out, scale 150ms ease-out, border-color 150ms ease-out;
      }
      .gv-bridge-btn:active,
      .gv-bridge-btn-sec:active {
        scale: 0.98;
      }
    }
    .gv-bridge-btn:hover,
    .gv-bridge-btn-sec:hover {
      opacity: 0.88;
    }
    :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
      outline: 2px solid CanvasText;
      outline-offset: 3px;
    }
    .gv-bridge-btn {
      background: var(--gv-cta-bg);
      color: var(--gv-cta-fg);
      border: 1px solid transparent;
      font-size: 0.9375rem;
      margin-bottom: 0.625rem;
    }
    .gv-bridge-btn-sec {
      background: transparent;
      color: var(--gv-txt);
      font-size: 0.875rem;
      border: 1px solid var(--gv-line);
    }
  </style>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (const r of registrations) { r.unregister(); }
      });
    }

    (function() {
      const search = window.location.search || '';
      const hash = window.location.hash || '';
      const params = new URLSearchParams(search);
      const hashParams = new URLSearchParams(hash.replace(/^#/, ''));

      const isApkBridge = params.get('apk_redirect') === '1' ||
                          hashParams.get('apk_redirect') === '1' ||
                          window.location.pathname.indexOf('/apk-callback') === 0;

      const hasAuthPayload = params.has('code') ||
                             params.has('error') ||
                             hashParams.has('access_token') ||
                             hashParams.has('error');

      if (isApkBridge) {
        const isAndroid = /android/i.test(navigator.userAgent || '');
        const deepLink = 'goldvault://login-callback' + search + hash;
        const intentPath = 'login-callback' + search + hash;
        const intentUrl = 'intent://' + intentPath + '#Intent;scheme=goldvault;package=app.goldvault.goldvault;end';

        // Build DOM programmatically (avoid innerHTML with untrusted URL query/hash)
        const wrap = document.createElement('main');
        wrap.className = 'gv-bridge-wrap';

        const card = document.createElement('section');
        card.className = 'gv-bridge-card';

        const logo = document.createElement('div');
        logo.className = 'gv-bridge-logo';
        logo.appendChild(document.createTextNode('Gold'));
        const logoAccent = document.createElement('span');
        logoAccent.textContent = 'Vault';
        logo.appendChild(logoAccent);

        const desc = document.createElement('p');
        desc.className = 'gv-bridge-desc';
        desc.textContent = hasAuthPayload
          ? 'Autenticación completada. Redirigiendo de vuelta a la aplicación GoldVault en tu teléfono...'
          : 'Conectando con la aplicación GoldVault...';

        const openAppLink = document.createElement('a');
        openAppLink.id = 'gv-open-apk';
        openAppLink.className = 'gv-bridge-btn';
        openAppLink.href = deepLink;
        openAppLink.textContent = 'Abrir en la app GoldVault';

        card.appendChild(logo);
        card.appendChild(desc);
        card.appendChild(openAppLink);

        if (isAndroid) {
          const openIntentLink = document.createElement('a');
          openIntentLink.id = 'gv-open-intent';
          openIntentLink.className = 'gv-bridge-btn-sec';
          openIntentLink.href = intentUrl;
          openIntentLink.textContent = 'Reintentar apertura directa';
          card.appendChild(openIntentLink);
        }

        wrap.appendChild(card);
        document.body.replaceChildren(wrap);

        // Trigger immediate deep link redirect back to the native app (Android & iOS)
        try {
          window.location.replace(deepLink);
        } catch (_) {}

        if (isAndroid) {
          setTimeout(function() {
            try {
              window.location.href = intentUrl;
            } catch (_) {}
          }, 650);
        }

        return;
      }

      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
