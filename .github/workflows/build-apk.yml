name: Validate and build GoldVault

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: goldvault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_version.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none
      - name: Prepare Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/goldvault-release.jks"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/goldvault-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build Android release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: flutter build apk --release --no-tree-shake-icons
      - name: Verify Android APK signature
        env:
          REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: |
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK build-tools" >&2
            exit 1
          fi
          SIG_OUT="$("$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$SIG_OUT"
          if [ "$REQUIRE_RELEASE_SIGNING" = "true" ] && echo "$SIG_OUT" | grep -q "CN=Android Debug"; then
            echo "ERROR: Release tag APK must not be signed with the Android Debug certificate." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GoldVault-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GoldVault-Web
          path: build/web
          if-no-files-found: error

  build-ios:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoldVault-Android
      - name: Name release asset
        run: mv app-release.apk GoldVault.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GoldVault ${{ github.ref_name }}
          generate_release_notes: true
          files: GoldVault.apk
          fail_on_unmatched_files: true
