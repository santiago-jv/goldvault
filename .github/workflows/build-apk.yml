name: Validate and build GoldVault

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: goldvault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_version.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none
      - name: Prepare Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/goldvault-release.jks"
            echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/goldvault-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build Android release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: flutter build apk --release --no-tree-shake-icons
      - name: Verify Android APK signature
        env:
          REQUIRE_RELEASE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
        run: |
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found in Android SDK build-tools" >&2
            exit 1
          fi
          SIG_OUT="$("$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$SIG_OUT"
          if [ "$REQUIRE_RELEASE_SIGNING" = "true" ] && echo "$SIG_OUT" | grep -q "CN=Android Debug"; then
            echo "ERROR: Release tag APK must not be signed with the Android Debug certificate." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GoldVault-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GoldVault-Web
          path: build/web
          if-no-files-found: error

  build-ios:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Vercel deployment credentials
        id: vercel_creds
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Vercel deploy: configure VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download compiled Flutter Web artifact
        if: steps.vercel_creds.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: GoldVault-Web
          path: build/web
      - name: Install Vercel CLI
        if: steps.vercel_creds.outputs.configured == 'true'
        run: npm install -g vercel@66
      - name: Pull Vercel environment
        if: steps.vercel_creds.outputs.configured == 'true'
        env:
          IS_PROD: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            vercel pull --yes --environment=production
          else
            vercel pull --yes --environment=preview
          fi
      - name: Build Vercel prebuilt output
        if: steps.vercel_creds.outputs.configured == 'true'
        env:
          IS_PROD: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            vercel build --prod
          else
            vercel build
          fi
      - name: Deploy prebuilt bundle to Vercel
        if: steps.vercel_creds.outputs.configured == 'true'
        env:
          IS_PROD: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            DEPLOY_URL="$(vercel deploy --prebuilt --prod --yes)"
            TARGET="production"
          else
            DEPLOY_URL="$(vercel deploy --prebuilt --yes)"
            TARGET="preview"
          fi
          echo "Deployed to Vercel ($TARGET): $DEPLOY_URL"
          {
            echo "### Vercel Web Deployment"
            echo "- **Target**: \`$TARGET\`"
            echo "- **URL**: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-ios, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoldVault-Android
      - name: Name release asset
        run: mv app-release.apk GoldVault.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GoldVault ${{ github.ref_name }}
          generate_release_notes: true
          files: GoldVault.apk
          fail_on_unmatched_files: true
