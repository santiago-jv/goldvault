name: Validate and build GoldVault

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: goldvault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_version.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --pwa-strategy=none
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: GoldVault-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: GoldVault-Web
          path: build/web
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoldVault-Android
      - name: Name release asset
        run: mv app-release.apk GoldVault.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GoldVault ${{ github.ref_name }}
          generate_release_notes: true
          files: GoldVault.apk
          fail_on_unmatched_files: true
